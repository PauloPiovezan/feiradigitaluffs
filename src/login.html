<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href="css/output.css">
    <title>Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>

<body class=" min-h-screen flex flex-col">
    <header>
        <div class="w-screen h-12 bg-brand-blue flex flex-row justify-center items-center gap-2">
        </div>
    </header>
   
    <div class="bg-brand-bg w-screen max-h-screen flex-1 flex p-4 gap-5 items-center justify-center">

            <div class="w-50 h-64 bg-brand-bg outline-3 outline-brand-surface flex flex-col items-center justify-start p-6 gap-6 rounded-2xl">
                <h1 class="font-bold">Entrar como</h1>
                <button class = "bg-brand-blue w-32 p-2 rounded-2xl hover:bg-blue-500 active:bg-blue-800" onclick="loginVendedor()">Vendedor</button>
                <button class = "bg-brand-blue w-32 p-2 rounded-2xl hover:bg-blue-500 active:bg-blue-800" onclick="loginCliente()">Cliente</button>
            </div>

    </div>
    <footer class="mt-6 w-full bg-brand-blue text-brand-bg py-6 px-4 lg:px-36">
    <div class="flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="font-extrabold text-xl">Feira Digital</div>

        <nav class="flex flex-wrap justify-center gap-6 text-sm font-medium">
            <a href="#" class="hover:underline">Ajuda e Suporte</a>
            <a href="#" class="hover:underline">Termos de Uso</a>
        </nav>

        <p class="text-xs opacity-80">© 2026 Feira Digital. Todos os direitos reservados.</p>
    </div>
    </footer>

    <script>

        function loginVendedor(){
            window.location.href = 'vitrine.html'
            localStorage.setItem('login','vendedor');
        }
        function loginCliente(){
            window.location.href = 'vitrine.html'
            localStorage.setItem('login','cliente');
        }


    </script>


</body>

</html>
